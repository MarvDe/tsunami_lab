args:
  solverName: hybrid
  setupName: tsunamiEvent2d
  cellSize: 250
  cellx: 10800
  celly: 6000
  endTime: 0
  timeSteps: 10000

setup:
  displacement: large_data/tohoku_gebco20_ucsb3_250m_displ.nc
  bathymetry: large_data/tohoku_gebco20_ucsb3_250m_bath.nc
  startCoordX: -200000
  startCoordY: -750000


tweaks:
  useEntropyFix: true
  manningFactor: 0.04

output:
  formatName: nc
  outputInterval: 250
  outputResolution: 1
  compressionLevel: 3
  checkpointInterval: 0
  snapshots: []
  stations: utilities/soma_stations.yml

omp:
  omp_num_threads: 24
  omp_schedule: static,8