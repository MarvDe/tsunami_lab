args:
  solverName: hybrid
  setupName: checkPoint
  cellSize: 250
  cellx: 10800
  celly: 6000
  endTime: 0
  timeSteps: 50

setup:
  inputFile: solution.nc
  appendFile: true

tweaks:
  useEntropyFix: true
  manningFactor: 0.02

output:
  formatName: nc
  outputInterval: 5
  outputResolution: 1
  compressionLevel: 0
  checkpointInterval: 10
  snapshots: []
  stations: ""

omp:
  omp_num_threads: 8
  omp_schedule: static,8
