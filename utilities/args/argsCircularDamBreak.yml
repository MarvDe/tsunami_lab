args:
  solverName: hybrid
  setupName: damBreak2d
  cellSize: 1
  cellx: 100
  celly: 100
  endTime: 50
  timeSteps: 0

setup:
  innerWaterHeight: 80
  innerWaterRadius: 10
  bathymetryCap: true

tweaks:
  useEntropyFix: true
  manningFactor: 0.4

output:
  formatName: nc
  outputInterval: 10
  outputResolution: 1
  compressionLevel: 0
  checkpointInterval: 100
  stations: ""

omp:
  omp_num_threads: 8
  omp_schedule: static,8