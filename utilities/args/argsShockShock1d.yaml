args:
  solverName: hybrid
  setupName: shockShock
  cellSize: 1
  cellx: 300
  celly: 1
  endTime: 40
  timeSteps: 0

setup:
  waterHeight: 30
  waterMomentum: 10
  locationDiscontinuity: 150

tweaks:
  useEntropyFix: true
  manningFactor: 0.02

output:
  formatName: csv
  outputInterval: 10
  outputResolution: 1
  compressionLevel: 0
  checkpointInterval: 100
  snapshots: []
  stations: ""

omp:
  omp_num_threads: 8
  omp_schedule: static,8
